name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      volledig:
        description: Alles opnieuw uploaden (niet alleen wijzigingen)
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-deploy:
    # Vast op 24.04: ubuntu-latest schuift vanaf okt 2026 door naar Ubuntu 26 (andere lftp-versie)
    runs-on: ubuntu-24.04
    environment: production
    env:
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_PORT: ${{ secrets.SFTP_PORT }}
      SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # volledige historie, nodig om te bepalen wat er gewijzigd is

      # Zelfde PHP-versie als de server (PHP 8.3)
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: PHP syntaxcontrole
        run: |
          git ls-files -z '*.php' | xargs -0 -n1 php -l

      - name: Controleer sitemap en robots
        run: |
          python3 -c 'import xml.etree.ElementTree as ET; ET.parse("sitemap.xml")'
          test -f robots.txt

      - name: lftp installeren en instellen
        # ftp:ssl-allow: gebruikt FTPS (TLS) als de server dat ondersteunt, anders gewone FTP.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          cat > ~/.lftprc <<'EOF'
          set cmd:fail-exit yes
          set ftp:ssl-allow true
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:max-retries 3
          set net:timeout 30
          EOF

      - name: Laatst gedeployde versie ophalen
        # .deploy-rev op de server bevat de commit van de vorige deploy.
        run: |
          lftp -u "$SFTP_USERNAME,$SFTP_PASSWORD" -p "${SFTP_PORT:-21}" "ftp://$SFTP_HOST" \
            -e "get ${SFTP_REMOTE_DIR:-public_html}/.deploy-rev -o prev-rev; bye" || true

      - name: Deploy-map samenstellen (alleen wijzigingen)
        # Alles wat niet op de server hoort blijft achter.
        # lanegra-chat/config.php staat op de server met echte keys en mag niet overschreven worden.
        run: |
          PREV=$(cat prev-rev 2>/dev/null | tr -d '[:space:]')
          if [ "${{ inputs.volledig }}" = "true" ] || git log -1 --format=%B | grep -qF '[volledig]'; then
            echo "Volledige upload gevraagd"
            git ls-files > changed.txt
          elif [ -n "$PREV" ] && git cat-file -e "$PREV^{commit}" 2>/dev/null; then
            echo "Vorige deploy: $PREV — alleen wijzigingen sinds die commit"
            git diff --name-only --diff-filter=ACMR "$PREV" HEAD > changed.txt
          else
            echo "Geen (geldige) vorige deploy gevonden — volledige upload"
            git ls-files > changed.txt
          fi

          grep -v -E '^(\.github/|server/|\.gitignore$|readme\.md$|LEESMIJ\.md$|lanegra-chat/config\.php$)|(^|/)\.DS_Store$' changed.txt > upload.txt || true

          mkdir dist
          rsync -a --files-from=upload.txt ./ dist/
          echo "Te uploaden: $(wc -l < upload.txt) bestand(en)"
          cat upload.txt

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: config.php plaatsen als die nog niet op de server staat
        # Een bestaande config.php (met echte sleutels) wordt nooit overschreven.
        # Lukt het uitlezen van de map niet, dan faalt deze stap in plaats van te gokken.
        run: |
          DIR="${SFTP_REMOTE_DIR:-public_html}/lanegra-chat"
          lftp --version | head -1
          if ! LIST=$(lftp -u "$SFTP_USERNAME,$SFTP_PASSWORD" -p "${SFTP_PORT:-21}" "ftp://$SFTP_HOST" -e "cls -1a \"$DIR/\"; bye" 2>lftp-err.txt); then
            echo "::error::FTP: kon $DIR niet uitlezen: $(tr '\n' ' ' < lftp-err.txt)"
            exit 1
          fi
          echo "Inhoud van $DIR:"; echo "$LIST"
          if echo "$LIST" | grep -qE '(^|/)config\.php$'; then
            echo "config.php staat al op de server, niet aangeraakt"
          else
            echo "config.php ontbreekt op de server, standaardversie uit de repo wordt geplaatst"
            lftp -u "$SFTP_USERNAME,$SFTP_PASSWORD" -p "${SFTP_PORT:-21}" "ftp://$SFTP_HOST" \
              -e "put lanegra-chat/config.php -o \"$DIR/config.php\"; bye"
          fi

      - name: Upload via FTP
        # Geen --delete: bestanden die alleen op de server staan (data/, .htaccess,
        # stuur-offerte.php, betaling-aanmaken-live.php, save-lead.php ...) blijven staan.
        # Daarna wordt .deploy-rev bijgewerkt, zodat de volgende run weet waar hij was.
        run: |
          DIR="${SFTP_REMOTE_DIR:-public_html}"
          echo "$GITHUB_SHA" > .deploy-rev
          if [ -s upload.txt ]; then
            MIRROR="mirror --reverse --parallel=4 --verbose dist/ \"$DIR\";"
          else
            echo "Geen gewijzigde bestanden om te uploaden"
          fi
          lftp -u "$SFTP_USERNAME,$SFTP_PASSWORD" -p "${SFTP_PORT:-21}" "ftp://$SFTP_HOST" \
            -e "$MIRROR put .deploy-rev -o \"$DIR/.deploy-rev\"; bye"

      - name: Revolut-sleutel op de server zetten
        # Schrijft config-revolut.php (staat niet in de repo) met de secret REVOLUT_SECRET_KEY.
        # Leeg secret = stap overslaan, een bestaand bestand op de server blijft dan staan.
        env:
          REVOLUT_SECRET_KEY: ${{ secrets.REVOLUT_SECRET_KEY }}
          REVOLUT_SANDBOX: ${{ secrets.REVOLUT_SANDBOX }}
        run: |
          if [ -z "$REVOLUT_SECRET_KEY" ]; then echo "Geen REVOLUT_SECRET_KEY ingesteld, overgeslagen"; exit 0; fi
          case "$REVOLUT_SECRET_KEY" in *[!A-Za-z0-9_-]*) echo "::error::REVOLUT_SECRET_KEY bevat ongeldige tekens"; exit 1;; esac
          F="$RUNNER_TEMP/config-revolut.php"
          {
            echo "<?php"
            echo "// Automatisch geplaatst door de deploy-pipeline (GitHub secret REVOLUT_SECRET_KEY). Niet handmatig wijzigen."
            echo "if (!defined('REVOLUT_SECRET_KEY')) define('REVOLUT_SECRET_KEY', '$REVOLUT_SECRET_KEY');"
            if [ "$REVOLUT_SANDBOX" = "true" ]; then echo "if (!defined('REVOLUT_SANDBOX')) define('REVOLUT_SANDBOX', true);"; fi
          } > "$F"
          lftp -u "$SFTP_USERNAME,$SFTP_PASSWORD" -p "${SFTP_PORT:-21}" "ftp://$SFTP_HOST" \
            -e "put \"$F\" -o \"${SFTP_REMOTE_DIR:-public_html}/config-revolut.php\"; bye"
          rm -f "$F"
          echo "config-revolut.php geplaatst$([ "$REVOLUT_SANDBOX" = "true" ] && echo ' (sandbox)')"

      - name: Google Agenda-koppeling op de server zetten
        # Schrijft agenda/config-google.php (staat niet in de repo) uit de secrets
        # GOOGLE_CALENDAR_ID en GOOGLE_SERVICE_ACCOUNT_JSON. Lege secrets = overslaan.
        env:
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_CALENDAR_ID" ] || [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then echo "Geen Google-secrets ingesteld, overgeslagen"; exit 0; fi
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('client_email') and d.get('private_key')" \
            || { echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON is geen geldig sleutelbestand van een serviceaccount"; exit 1; }
          case "$GOOGLE_CALENDAR_ID" in *"'"*|*"\\"*) echo "::error::GOOGLE_CALENDAR_ID bevat ongeldige tekens"; exit 1;; esac
          F="$RUNNER_TEMP/config-google.php"
          {
            echo "<?php"
            echo "// Automatisch geplaatst door de deploy-pipeline (GitHub-secrets). Niet handmatig wijzigen."
            echo "define('LNA_CALENDAR_ID', '$GOOGLE_CALENDAR_ID');"
            echo "define('LNA_SERVICE_JSON_B64', '$(printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" | base64 -w0)');"
          } > "$F"
          lftp -u "$SFTP_USERNAME,$SFTP_PASSWORD" -p "${SFTP_PORT:-21}" "ftp://$SFTP_HOST" \
            -e "put \"$F\" -o \"${SFTP_REMOTE_DIR:-public_html}/agenda/config-google.php\"; bye"
          rm -f "$F"
          echo "Google Agenda-koppeling geplaatst"

      - name: Beveiligingsregels in .htaccess zetten
        # Voegt server/beveiliging.htaccess toe aan de bestaande .htaccess (doorverwijzingen blijven staan),
        # bewaart een reservekopie als .htaccess-backup en zet die terug als de site daarna niet goed laadt.
        # Met secret ADMIN_WACHTWOORD komen admin-offerte.html, leads-overzicht.html en save-lead.php
        # achter een wachtwoord (gebruikersnaam: beheer).
        env:
          ADMIN_WACHTWOORD: ${{ secrets.ADMIN_WACHTWOORD }}
          SITE: https://lanegra-entertainment.nl
        run: |
          DIR="${SFTP_REMOTE_DIR:-public_html}"
          ftp() { lftp -u "$SFTP_USERNAME,$SFTP_PASSWORD" -p "${SFTP_PORT:-21}" "ftp://$SFTP_HOST" -e "$1; bye"; }

          # Bestaande .htaccess ophalen; mislukt dat terwijl hij wel bestaat, dan niets aanraken
          if ftp "cls -1a \"$DIR/\"" | grep -qE '(^|/)\.htaccess$'; then
            ftp "get \"$DIR/.htaccess\" -o htaccess.server"
          else
            : > htaccess.server
          fi

          HTPASSWD=""
          if [ -n "$ADMIN_WACHTWOORD" ]; then
            # Absoluut pad van de webmap bepalen via een tijdelijk script (direct weer verwijderd)
            T="pad-$(openssl rand -hex 12).php"
            echo '<?php echo __DIR__;' > "$T"
            ftp "put \"$T\" -o \"$DIR/$T\""
            ABS=$(curl -fsS "$SITE/$T" || true)
            ftp "rm \"$DIR/$T\"" || true
            case "$ABS" in /*) ;; *) echo "::error::Kon het pad van de webmap niet bepalen"; exit 1;; esac
            printf 'beheer:%s\n' "$(openssl passwd -apr1 "$ADMIN_WACHTWOORD")" > htpasswd-beheer
            ftp "put htpasswd-beheer -o \"$DIR/.htpasswd-beheer\""
            HTPASSWD="$ABS/.htpasswd-beheer"
            rm -f htpasswd-beheer
          fi

          python3 .github/scripts/htaccess-merge.py htaccess.server server/beveiliging.htaccess "$HTPASSWD" > htaccess.nieuw
          if cmp -s htaccess.server htaccess.nieuw; then echo ".htaccess is al up-to-date"; exit 0; fi

          ftp "put htaccess.server -o \"$DIR/.htaccess-backup\"; put htaccess.nieuw -o \"$DIR/.htaccess\""
          sleep 3
          for u in / /index.html /acts/brassband.html /offerte-rider.html /lanegra-chat/lanegra-chat.js /assets/css/style.css; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "$SITE$u")
            if [ "$c" != "200" ]; then
              echo "::error::$u gaf $c met de nieuwe .htaccess – oude versie teruggezet"
              ftp "put htaccess.server -o \"$DIR/.htaccess\""
              exit 1
            fi
          done
          echo "Beveiligingsregels actief"
